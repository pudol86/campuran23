  <style>
    :root{
      --bg:#000000; --text:#f1f5f9; --muted:#94a3b8; --line:#1f2937; --card:#0b0b0b;
      --btn:#ffffff; --btnText:#000000; --btnHover:#e5e7eb; --accent:#ef4444;
    }

    /* ===== RESET & BASE ===== */
    *,*::before,*::after{ box-sizing:border-box }
    html{ -webkit-text-size-adjust:100% }
    html,body{ min-height:100%; margin:0 }
    body{
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;
      color:var(--text); background:var(--bg); line-height:1.45;
      overflow-x:hidden;
    }
    img,video,canvas,svg,iframe{ max-width:100%; height:auto; display:block }

    /* ===== APP BAR ===== */
    .appbar{
      position:sticky; top:0; z-index:20; background:rgba(0,0,0,.8);
      backdrop-filter:saturate(180%) blur(8px); -webkit-backdrop-filter:saturate(180%) blur(8px);
      border-bottom:1px solid var(--line);
    }
    .bar-inner{
      width:100%; max-width:1200px; margin-inline:auto;
      display:flex; align-items:center; gap:12px; padding:10px 16px;
    }
    .brand{ display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.2px }
    .logo{ display:inline-grid; place-items:center; width:28px; height:28px; border-radius:6px; background:#fff; color:#000; font-size:14px }
    .spacer{ flex:1 }
    .btn{ appearance:none; border:0; padding:10px 14px; border-radius:12px; background:var(--btn); color:var(--btnText); font:600 14px Inter,system-ui,sans-serif; cursor:pointer; touch-action:manipulation }
    .btn:hover{ background:var(--btnHover) }

    /* ===== BANNER INFO ===== */
    .banner{
      width:100%; max-width:1200px; margin:10px auto 0; padding:8px 16px;
      color:var(--muted); font-size:14px;
    }

    /* ===== LAYOUT ===== */
    .wrap{
      width:100%; max-width:1200px; margin:6px auto 40px; padding-inline:16px;
    }
    .player-shell{ display:flex; flex-direction:column; align-items:center; margin-top:20px }

    /* ===== SLOT IKLAN BANNER 728x90 (di atas video) ===== */
    .ad-top{
      width:100%; max-width:728px; height:90px;
      margin:0 auto 18px; overflow:hidden;
    }
    .ad-top-inner{
      width:728px; height:90px; transform-origin:top left;
      display:flex; align-items:center; justify-content:center;
    }
    .ad-placeholder{
      width:100%; height:100%;
      display:grid; place-items:center;
      background:var(--card); border:1px dashed #2b3441; border-radius:12px;
      color:var(--muted); font-size:14px; text-align:center;
    }

    /* Video 16:9 */
    .phone{
      position:relative;
      width:min(100%, 960px);
      aspect-ratio:16/9;
      border-radius:16px; overflow:hidden; background:#000;
      border:1px solid var(--line);
      box-shadow:0 10px 30px rgba(0,0,0,.6);
    }
    .phone video{ width:100%; height:100%; object-fit:contain; background:#000 }

    /* Footer meta */
    .meta{
      width:100%; max-width:760px; margin:22px auto 0; padding:0 6px;
      text-align:center; color:var(--muted); font-size:13px;
    }

    /* ===== POPUP KONFIRMASI USIA ===== */
    .age-backdrop{
      position:fixed; inset:0; z-index:9999;
      display:grid; place-items:center;
      padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background:rgba(0,0,0,.72);
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
      opacity:0; visibility:hidden; pointer-events:none;
      transition:opacity .22s ease, visibility .22s ease;
    }
    .age-backdrop.show{ opacity:1; visibility:visible; pointer-events:auto }

    .age-dialog{
      width:min(420px, 100%);
      max-height:100%; overflow-y:auto;
      padding:clamp(22px, 5vw, 32px) clamp(18px, 5vw, 28px) clamp(18px, 4vw, 24px);
      text-align:center; color:#f3f4f6;
      background:linear-gradient(180deg,#191919 0%,#0c0c0c 100%);
      border:1px solid #2a2a2a; border-radius:22px;
      box-shadow:0 24px 80px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.05);
      transform:translateY(14px) scale(.96);
      transition:transform .25s cubic-bezier(.2,.8,.2,1);
    }
    .age-backdrop.show .age-dialog{ transform:none }

    .age-badge{
      width:68px; height:68px; margin:0 auto 16px; border-radius:50%;
      display:grid; place-items:center;
      font-weight:800; font-size:22px; letter-spacing:-.5px; color:#fff;
      background:radial-gradient(circle at 30% 25%, #f87171, #dc2626 60%, #991b1b);
      box-shadow:0 0 0 6px rgba(239,68,68,.15), 0 8px 24px rgba(239,68,68,.35);
    }
    .age-title{ margin:0 0 8px; font-size:clamp(1.15rem, 4.5vw, 1.4rem); font-weight:800; line-height:1.25 }
    .age-text{ margin:0 0 22px; font-size:clamp(.9rem, 3.6vw, .98rem); line-height:1.6; color:#a3acba }

    .age-actions{ display:flex; flex-direction:column; gap:10px }
    .age-btn{
      appearance:none; width:100%; min-height:48px; padding:12px 16px;
      border-radius:14px; border:1px solid transparent;
      font:700 15px Inter,system-ui,sans-serif; letter-spacing:.2px;
      cursor:pointer; touch-action:manipulation;
      transition:transform .12s ease, background .15s ease, filter .15s ease;
    }
    .age-btn:active{ transform:scale(.98) }
    .age-btn:focus-visible{ outline:2px solid #fff; outline-offset:2px }
    .age-btn.primary{
      color:#fff; background:linear-gradient(180deg,#f05252,#dc2626);
      box-shadow:0 8px 20px rgba(220,38,38,.35);
    }
    .age-btn.primary:hover{ filter:brightness(1.08) }
    .age-btn.ghost{ color:#cbd5e1; background:transparent; border-color:#2f2f2f; font-weight:600 }
    .age-btn.ghost:hover{ background:#161616 }

    @media (max-width:360px){
      .age-badge{ width:56px; height:56px; font-size:18px; margin-bottom:12px }
    }
    @media (max-height:480px){
      .age-badge{ display:none }
      .age-text{ margin-bottom:14px }
    }
    @media (prefers-reduced-motion:reduce){
      .age-backdrop,.age-dialog,.age-btn{ transition:none }
    }
  </style>

<body>

        <span>Short<span style="color:#3b82f6">Drama</span></span>
      </div>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="wrap">
    <section class="player-shell">

      <!-- ===== SLOT IKLAN BANNER 728x90 (di atas video) =====
           Ganti isi .ad-placeholder di bawah dengan kode iklan 728x90 kamu.
           Di layar kecil, slot ini otomatis diperkecil agar muat. -->
      <div class="ad-top" id="ad-top">
        <div class="ad-top-inner">
          <div class="ad-placeholder" data-i18n="<script type="text/javascript" data-cfasync="false" async src="https://poweredby.jads.co/js/jads.js"></script>
            <ins id="1128118" data-width="728" data-height="102"></ins>
            <script type="text/javascript" data-cfasync="false" async>(adsbyjuicy = window.adsbyjuicy || []).push({'adzone':1128118});</script>"</div>

      <div class="phone">
        <!-- Tanpa autoplay: video baru diputar setelah pengunjung menekan play -->
        <video id="video" playsinline controls preload="metadata">
          <span data-i18n="noVideo">Browser kamu tidak mendukung pemutar video HTML5.</span>

  <script async src="https://js.wpadmngr.com/static/adManager.js" data-admpid="429069"></script>

  <script>
    /* ================== BAHASA OTOMATIS (ID / EN) ================== */
    const I18N = {
      id: {
        upload:'Unggah',
        advertise:'Iklan',
        adSlot:'Slot Iklan 728×90 (contoh)',
        noVideo:'Browser kamu tidak mendukung pemutar video HTML5.',
        hint:'Putar untuk memulai',
        ageTitle:'Konfirmasi Usia',
        ageText:'Konten ini khusus pengunjung berusia 18 tahun ke atas. Apakah Anda berusia 18+ dan ingin melanjutkan?',
        continueBtn:'Lanjutkan Menonton',
        cancelBtn:'Batal'
      },
      en: {
        upload:'Upload',
        advertise:'Advertise',
        adSlot:'Ad Slot 728×90 (example)',
        noVideo:'Your browser does not support the HTML5 video player.',
        hint:'Press play to start',
        ageTitle:'Age Confirmation',
        ageText:'This content is intended for visitors aged 18 and over. Are you 18+ and would you like to continue?',
        continueBtn:'Continue Watching',
        cancelBtn:'Cancel'
      }
    };
    let LANG = 'id';

    function applyLang(lang){
      LANG = (lang === 'id') ? 'id' : 'en';
      document.documentElement.lang = LANG;
      document.querySelectorAll('[data-i18n]').forEach(function(el){
        const k = el.getAttribute('data-i18n');
        if (I18N[LANG][k] != null) el.textContent = I18N[LANG][k];
      });
      updateMeta();
    }

    /* Tebakan awal (sebelum data negara dari GeoJS masuk): zona waktu / bahasa browser */
    function guessLang(){
      try{
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
        if (/^Asia\/(Jakarta|Makassar|Jayapura|Pontianak)$/.test(tz)) return 'id';
      }catch(_){}
      const nl = (navigator.language || '').toLowerCase();
      return nl.indexOf('id') === 0 ? 'id' : 'en';
    }

    /* Callback GeoJS: Indonesia -> bahasa Indonesia, negara lain -> Inggris */
    function geoip(g){
      if (g && g.country) applyLang(g.country === 'ID' ? 'id' : 'en');
    }

    /* Skala slot iklan 728x90 agar muat di layar kecil */
    function fitAd(){
      const box = document.getElementById('ad-top');
      if(!box) return;
      const inner = box.firstElementChild;
      const s = Math.min(1, box.clientWidth / 728);
      inner.style.transform = 'scale(' + s + ')';
      box.style.height = (90 * s) + 'px';
    }
    window.addEventListener('resize', fitAd);
    window.addEventListener('orientationchange', fitAd);
    window.addEventListener('load', fitAd);
    fitAd();

    // Update teks durasi kecil
    const v = document.getElementById('video');
    const meta = document.getElementById('meta');
    function fmt(t){
      if (!isFinite(t)) t = 0;
      const m = Math.floor(t/60), s = Math.floor(t%60).toString().padStart(2,'0');
      return `${m}:${s}`;
    }
    function updateMeta(){
      const started = v.currentTime > 0 || !v.paused;
      meta.textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration) +
        (started ? '' : ' • ' + I18N[LANG].hint);
    }
    v.autoplay = false;
    v.addEventListener('loadedmetadata', updateMeta);
    v.addEventListener('timeupdate',     updateMeta);
    v.addEventListener('play',           updateMeta);
    v.addEventListener('pause',          updateMeta);

    applyLang(guessLang());

    /* ===== VIDEO BERGANTI OTOMATIS TIAP RELOAD ===== */
    const VIDEO_LIST_URL = "videos.txt";   // daftar link, satu link per baris
    const AUTO_NEXT      = true;           // true = setelah selesai otomatis lanjut ke video berikutnya
    const FALLBACK_LIST  = ["https://cdn.aceimg.com/dAb0N7A6i.mp4"]; // dipakai jika videos.txt gagal dimuat
    const QUEUE_KEY      = "video_queue_v1";

    let LIST = [];

    function hashList(list){
      const s = list.join("|"); let h = 0;
      for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
      return h + ":" + list.length;
    }
    function shuffle(a){
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }
    function readState(){
      try{ return JSON.parse(localStorage.getItem(QUEUE_KEY) || "null"); }catch(e){ return null; }
    }
    function writeState(s){
      try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(s)); }catch(e){}
    }

    // Antrean acak per pengunjung: semua video tampil dulu sebelum ada yang berulang
    function nextVideo(){
      if(LIST.length === 1) return LIST[0];
      const sig = hashList(LIST);
      let st = readState();
      const lastShown = (st && st.sig === sig && typeof st.lastShown === "number") ? st.lastShown : -1;

      if(!st || st.sig !== sig || !Array.isArray(st.order) || st.pos >= st.order.length){
        const order = shuffle(LIST.map((_,i)=>i));
        if(order[0] === lastShown){ [order[0],order[1]] = [order[1],order[0]]; } // hindari video yang sama dua kali berturut-turut
        st = { sig, order, pos:0, lastShown };
      }
      const idx = st.order[st.pos++];
      st.lastShown = idx;
      writeState(st);
      return LIST[idx];
    }

    function parseList(text){
      const seen = new Set();
      return text.split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l && !l.startsWith("#") && /^https?:\/\//i.test(l))
        .filter(l => !seen.has(l) && seen.add(l));
    }

    async function initVideo(){
      try{
        const res = await fetch(VIDEO_LIST_URL, { cache:"no-cache" });
        if(!res.ok) throw new Error("HTTP " + res.status);
        LIST = parseList(await res.text());
      }catch(e){
        LIST = [];
      }
      if(!LIST.length) LIST = FALLBACK_LIST.slice();
      v.src = nextVideo();
      v.load();
    }

    v.addEventListener("ended", ()=>{
      if(!AUTO_NEXT || LIST.length < 2) return;
      v.src = nextVideo();
      v.play().catch(()=>{});
    });

    initVideo();
  </script>

  <!-- ========== POPUP KONFIRMASI USIA ========== -->
  <div id="age-backdrop" class="age-backdrop" aria-hidden="true">
    <div id="age-dialog" class="age-dialog" role="dialog" aria-labelledby="age-title" aria-describedby="age-text" aria-modal="true">
      <div class="age-badge" aria-hidden="true">18+</div>
      <h3 id="age-title" class="age-title" data-i18n="ageTitle">Konfirmasi Usia</h3>
      <p id="age-text" class="age-text" data-i18n="ageText">Konten ini khusus pengunjung berusia 18 tahun ke atas. Apakah Anda berusia 18+ dan ingin melanjutkan?</p>
      <div class="age-actions">
        <button id="age-continue" type="button" class="age-btn primary" data-i18n="continueBtn">Lanjutkan Menonton</button>
        <button id="age-cancel" type="button" class="age-btn ghost" data-i18n="cancelBtn">Batal</button>
      </div>
    </div>
  </div>

<script>
/* ================== KONFIG ================== */
const AGE_NEXT_URL       = "https://toughiebubo.com/iucihXRModP/137253"; // tujuan tombol LANJUTKAN MENONTON
const OFFER_URL          = "https://toughiebubo.com/iucihXRModP/137253"; // tujuan tombol BATAL
const AUTO_SHOW_DELAY_MS = 15000;
const REMEMBER_TTL_MIN   = 120;
/* ============================================ */

const $root      = document.documentElement;
const $body      = document.body;
const $backdrop  = document.getElementById('age-backdrop');
const $btnCancel = document.getElementById('age-cancel');
const $btnGo     = document.getElementById('age-continue');

function lockScroll(on){ $root.style.overflow = $body.style.overflow = on ? 'hidden' : ''; }

function showModal(){
  if(!$backdrop) return;
  $backdrop.setAttribute('aria-hidden','false');
  $backdrop.classList.add('show');
  lockScroll(true);
  try{ $btnGo.focus({preventScroll:true}); }catch(_){}
}

function destroyModal(){
  try{ lockScroll(false); }catch(_){}
  try{ $backdrop.setAttribute('aria-hidden','true'); }catch(_){}
  try{ $backdrop.remove(); }catch(_){ $backdrop.style.display='none'; }
}

/* === HANYA buka tab baru, JANGAN redirect halaman sekarang === */
function openInNewTabOnly(url){
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* === Simpan TTL agar popup tak muncul lagi === */
function rememberSkip(){
  try { localStorage.setItem('age_ok_time', String(Date.now())); } catch(_) {}
}
function shouldSkip(){
  try {
    const t = +localStorage.getItem('age_ok_time') || 0;
    return Date.now() - t < REMEMBER_TTL_MIN*60*1000;
  } catch(_) { return false; }
}

/* === Klik tombol === */
function handleChoice(url, ev){
  if(ev){
    ev.preventDefault();
    ev.stopPropagation();
    if (typeof ev.stopImmediatePropagation === 'function') ev.stopImmediatePropagation();
  }
  rememberSkip();
  destroyModal();
  openInNewTabOnly(url);
}

$btnGo.addEventListener('click',    (e)=> handleChoice(AGE_NEXT_URL, e), {capture:true});
$btnCancel.addEventListener('click',(e)=> handleChoice(OFFER_URL,  e), {capture:true});

// ESC menutup, klik backdrop tidak menutup
window.addEventListener('keydown', (e)=>{ if(e.key==='Escape') destroyModal(); });

// Tampilkan otomatis setelah delay, kecuali masih dalam TTL
window.addEventListener('load', ()=>{ if(!shouldSkip()) setTimeout(showModal, AUTO_SHOW_DELAY_MS); });
</script>
